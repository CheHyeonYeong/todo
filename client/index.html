<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Free ADHD Memo</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="src/config.js"></script>
  </head>
  <body>
    <section class="login-screen checking" id="loginScreen">
      <div class="login-panel">
        <img class="login-logo" src="icons/icon-192.png" alt="" width="76" height="76" />
        <h1 class="login-title">오늘 할 일, 시간까지 한눈에</h1>
        <p class="login-subtitle">할 일 · 메모 · 뽀모도로 · 타임테이블</p>
        <div class="login-loading" aria-live="polite"><span class="login-spinner" aria-hidden="true"></span>확인 중…</div>
        <button id="googleLoginButton" type="button">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Google로 계속하기
        </button>
        <p class="login-error" id="loginError"></p>
        <p class="login-hint">로그인하면 폰과 PC 어디서든 같은 데이터가 이어집니다.</p>
      </div>
    </section>
    <main class="app-shell">
      <header class="topbar">
        <span class="account-label" id="accountLabel"></span>
        <div class="topbar-actions">
          <button class="icon-button" id="memoDrawerToggle" type="button" title="메모 열기">
            <span aria-hidden="true">✎</span>메모
          </button>
          <button class="icon-button" id="logoutButton" type="button" title="로그아웃">Logout</button>
          <span class="sync-status" id="syncStatus">local</span>
        </div>
      </header>

      <section class="dashboard-grid">
        <div class="left-column" id="leftColumn">
        <section class="todo-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">todo</p>
              <h2>기간별 할 일</h2>
            </div>
            <div class="segmented todo-view-toggle" id="todoViewToggle">
              <button class="active" type="button" data-view="list">목록</button>
              <button type="button" data-view="calendar">캘린더</button>
            </div>
          </div>
          <form class="todo-form" id="todoForm">
            <input id="todoDraft" placeholder="할 일 추가" />
            <input type="date" id="todoDueDate" title="마감일 (선택)" />
            <select id="todoScope">
              <option value="day">오늘</option>
              <option value="week">이번 주</option>
              <option value="month">이번 달</option>
            </select>
            <button type="submit" title="추가"><span aria-hidden="true">+</span></button>
          </form>
          <div class="todo-columns" id="todoColumns"></div>

          <div class="calendar-view" id="calendarView" hidden>
            <div class="calendar-main">
              <div class="calendar-header">
                <button type="button" id="calendarPrevMonth" title="이전 달">‹</button>
                <h3 id="calendarMonthLabel"></h3>
                <button type="button" id="calendarNextMonth" title="다음 달">›</button>
              </div>
              <div class="calendar-weekdays">
                <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
              </div>
              <div class="calendar-grid" id="calendarGrid"></div>
            </div>
            <div class="calendar-day-detail" id="calendarDayDetail"></div>
          </div>
        </section>

        <div class="v-resize-handle" id="memoDockResizeHandle" title="드래그해서 높이 조절"></div>
        <section class="memo-dock" id="memoDock" hidden></section>
        </div>

        <div class="resize-handle" id="dashboardResizeHandle" title="드래그해서 너비 조절"></div>

        <div class="side-column" id="sideColumn">
          <aside class="focus-panel" draggable="true" data-block-id="focus">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">now</p>
                <h2>집중 큐</h2>
              </div>
              <span class="panel-icon drag-handle" aria-hidden="true" title="드래그해서 순서 변경">⠿</span>
            </div>
            <div class="focus-list" id="focusList"></div>
          </aside>

          <section class="pomodoro-panel" draggable="true" data-block-id="pomodoro">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">pomodoro</p>
                <h2>타이머</h2>
              </div>
              <span class="panel-icon drag-handle" aria-hidden="true" title="드래그해서 순서 변경">⠿</span>
            </div>
            <div class="timer" id="timerLabel">25:00</div>
            <div class="segmented" id="timerModes">
              <button class="active" type="button" data-mode="focus">집중</button>
              <button type="button" data-mode="short">짧은 휴식</button>
              <button type="button" data-mode="long">긴 휴식</button>
            </div>
            <div class="timer-config">
              <label for="timerMinutesInput">분 설정</label>
              <input type="number" id="timerMinutesInput" min="1" max="180" value="25" />
            </div>
            <div class="timer-actions">
              <button type="button" id="timerToggle"><span aria-hidden="true">▶</span>시작</button>
              <button type="button" id="timerReset"><span aria-hidden="true">↺</span>리셋</button>
            </div>
          </section>

          <section class="timetable-panel" draggable="true" data-block-id="timetable">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">time</p>
                <h2>타임테이블</h2>
              </div>
              <span class="panel-icon drag-handle" aria-hidden="true" title="드래그해서 순서 변경">⠿</span>
            </div>
            <form class="tracker-form" id="trackerForm">
              <input id="trackerInput" placeholder="지금 뭐 하는 중?" />
              <button type="submit" title="기록 시작"><span aria-hidden="true">▶</span>시작</button>
            </form>
            <div class="tracker-running" id="trackerRunning" hidden>
              <div class="tracker-running-info">
                <strong id="trackerRunningLabel"></strong>
                <span id="trackerRunningTime"></span>
              </div>
              <button type="button" id="trackerStop"><span aria-hidden="true">■</span>종료</button>
            </div>
            <div class="segmented timetable-view-toggle" id="timetableViewToggle">
              <button class="active" type="button" data-view="day">일</button>
              <button type="button" data-view="week">주</button>
            </div>
            <div class="timetable-header">
              <button type="button" id="timetablePrevDay" title="이전">‹</button>
              <h3 id="timetableDateLabel"></h3>
              <button type="button" id="timetableNextDay" title="다음">›</button>
            </div>
            <div class="timetable-list" id="timetableList"></div>
            <div class="timetable-total" id="timetableTotal"></div>
          </section>

        </div>
      </section>
    </main>

    <div class="memo-drawer-backdrop" id="memoDrawerBackdrop" hidden></div>
    <aside class="memo-drawer" id="memoDrawer">
      <div class="memo-drawer-header">
        <p class="eyebrow">quick capture</p>
        <button class="icon-button" id="memoDrawerClose" type="button" title="닫기">×</button>
      </div>
      <div class="memo-workspace" id="memoWorkspace">
      <form id="memoForm">
        <div class="panel-heading">
          <h2>생각나는 즉시 기록</h2>
          <span class="timestamp" id="todayLabel"></span>
        </div>
        <textarea id="memoDraft" placeholder="회의에서 나온 말, 갑자기 떠오른 일, - [ ] 해야 할 일, #태그"></textarea>
        <div class="capture-actions">
          <span id="nowLabel"></span>
          <button type="submit"><span aria-hidden="true">+</span>기록</button>
        </div>
      </form>

      <div class="panel-heading">
        <h2>타임라인</h2>
      </div>
      <div class="log-actions">
        <div class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="queryInput" placeholder="검색" />
        </div>
        <button class="icon-button" id="starFilterToggle" type="button" title="즐겨찾기만 보기">★</button>
      </div>
      <div class="tag-strip" id="tagStrip"></div>
      <div class="memo-list" id="memoList"></div>
      </div>
    </aside>

    <script src="src/app.js"></script>
  </body>
</html>
