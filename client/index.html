<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Free ADHD Memo</title>
    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="src/config.js"></script>
  </head>
  <body>
    <section class="login-screen" id="loginScreen" hidden>
      <form class="login-panel" id="loginForm">
        <p class="eyebrow">private workspace</p>
        <h1>Free ADHD Memo</h1>
        <button id="googleLoginButton" type="button" hidden>Google로 로그인</button>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호" />
        <button type="submit">로그인</button>
        <p class="login-error" id="loginError"></p>
      </form>
    </section>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">timestamp todo workspace</p>
          <h1>Free ADHD Memo</h1>
        </div>
        <button class="icon-button wide" id="exportButton" type="button" title="마크다운 내보내기">
          <span aria-hidden="true">↓</span>
          Export
        </button>
        <button class="icon-button" id="logoutButton" type="button" title="로그아웃">Logout</button>
        <span class="sync-status" id="syncStatus">local</span>
      </header>

      <section class="hero-grid">
        <form class="capture-panel" id="memoForm">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">quick capture</p>
              <h2>생각나는 즉시 기록</h2>
            </div>
            <span class="timestamp" id="todayLabel"></span>
          </div>
          <textarea id="memoDraft" placeholder="회의에서 나온 말, 갑자기 떠오른 일, - [ ] 해야 할 일, #태그"></textarea>
          <div class="capture-actions">
            <span id="nowLabel"></span>
            <button type="submit"><span aria-hidden="true">+</span>기록</button>
          </div>
        </form>

        <aside class="focus-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">now</p>
              <h2>집중 큐</h2>
            </div>
            <span class="panel-icon" aria-hidden="true">✦</span>
          </div>
          <div class="focus-list" id="focusList"></div>
        </aside>
      </section>

      <section class="dashboard-grid">
        <section class="todo-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">todo</p>
              <h2>기간별 할 일</h2>
            </div>
            <span class="panel-icon" aria-hidden="true">☑</span>
          </div>
          <form class="todo-form" id="todoForm">
            <input id="todoDraft" placeholder="할 일 추가" />
            <select id="todoScope">
              <option value="day">오늘</option>
              <option value="week">이번 주</option>
              <option value="month">이번 달</option>
            </select>
            <button type="submit" title="추가"><span aria-hidden="true">+</span></button>
          </form>
          <div class="todo-columns" id="todoColumns"></div>
        </section>

        <section class="pomodoro-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">pomodoro</p>
              <h2>타이머</h2>
            </div>
            <span class="panel-icon" aria-hidden="true">◷</span>
          </div>
          <div class="timer" id="timerLabel">25:00</div>
          <div class="segmented" id="timerModes">
            <button class="active" type="button" data-mode="focus">집중</button>
            <button type="button" data-mode="short">짧은 휴식</button>
            <button type="button" data-mode="long">긴 휴식</button>
          </div>
          <div class="timer-actions">
            <button type="button" id="timerToggle"><span aria-hidden="true">▶</span>시작</button>
            <button type="button" id="timerReset"><span aria-hidden="true">↺</span>리셋</button>
          </div>
        </section>
      </section>

      <section class="lower-grid">
        <section class="log-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">memo</p>
              <h2>타임라인</h2>
            </div>
            <div class="search-box">
              <span aria-hidden="true">⌕</span>
              <input id="queryInput" placeholder="검색" />
            </div>
          </div>
          <div class="tag-strip" id="tagStrip"></div>
          <div class="memo-list" id="memoList"></div>
        </section>

        <aside class="insight-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">review</p>
              <h2>오늘의 흐름</h2>
            </div>
            <span class="panel-icon" aria-hidden="true">◆</span>
          </div>
          <div class="stat-grid" id="stats"></div>
          <div class="activity-title"><span aria-hidden="true">▦</span>28일 기록</div>
          <div class="activity-grid" id="activityGrid"></div>
          <button class="reset-button" type="button" id="resetButton"><span aria-hidden="true">↺</span>샘플 상태로 초기화</button>
        </aside>
      </section>
    </main>
    <script src="src/app.js"></script>
  </body>
</html>
