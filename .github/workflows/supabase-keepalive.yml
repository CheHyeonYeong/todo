name: Supabase keep-alive

# Supabase 무료 플랜은 1주일간 API 활동이 없으면 프로젝트를 일시정지한다.
# 주 2회 가벼운 REST 요청을 보내서 활동으로 집계되게 한다.
# 프로젝트가 일시정지되면 이 워크플로가 실패해서 GitHub이 메일로 알려준다.

on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # anon key는 client/src/config.js에 이미 공개된 값이라 비밀이 아니다.
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdmdiZmZpaHN3Zmp6Z2Vnd2x4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5NzA5NzksImV4cCI6MjA5ODU0Njk3OX0.MrKmcsAMCU9fepyD97HMuSSImARjtchiCAaGRzgqsQ8"
          curl -sf "https://mkvgbffihswfjzgegwlx.supabase.co/rest/v1/todos?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"
