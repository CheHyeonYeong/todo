name: client CI

# client/ 가 바뀌는 PR에서 단위 테스트와 타입 체크를 돌린다.
# 리팩토링 PR이 "동작을 안 바꿨다"를 사람 기억이 아니라 CI로 확인하기 위한 것.
on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
