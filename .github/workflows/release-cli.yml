name: Release CLI

# 태그(v*)를 밀면 플랫폼별 todo 바이너리를 빌드해 릴리스에 올린다.
# npm 설치(scripts/fetch-cli-binary.js)는 latest 릴리스에서 이 파일들을 받아간다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: tui
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "tui/target/${{ matrix.target }}/release/todo.exe" "todo-${{ matrix.target }}.exe"
          else
            cp "tui/target/${{ matrix.target }}/release/todo" "todo-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: todo-${{ matrix.target }}
          path: todo-${{ matrix.target }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
